# AutoDL 正式预训练。本地冒烟用 smoke_pretrain.yaml。
stage: pretrain
tokenizer_dir: tokenizer/v1
output_dir: output/v1/pretrain
init_ckpt: null
model:
  hidden_size: 768
  num_hidden_layers: 12
  num_attention_heads: 8
  num_key_value_heads: 2
  vocab_size: 16384
  max_position_embeddings: 32768
data:
  path: dataset/pretrain_wikipedia.jsonl
  max_samples: null
train:
  epochs: 1
  batch_size: 8
  max_seq_len: 512
  learning_rate: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  accumulation_steps: 4
  log_interval: 20
  save_interval: 500
  num_workers: 2
  max_steps: null
  device: null
